name: contract-ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - run: python -m pip install -e . -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q tests
      - name: Coverage and wheel build
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          python -m pip install pytest-cov build
          python -m pytest -q tests --cov=stagecraft --cov-report=term-missing
          python -m build --outdir "$RUNNER_TEMP/dist"
      - run: python quickstart.py --out quickstart_output
  r-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Matrix
            bioc::edgeR
            bioc::limma
            bioc::fgsea
            any::jsonlite
            any::yaml
            any::digest
            any::statmod
          cache-version: 1
      - run: Rscript --vanilla tests/audit_boundaries.R
      - run: Rscript --vanilla tests/scientific_regression.R
      - run: Rscript --vanilla tests/pathway_contract.R
      - name: Part 5 null calibration smoke
        run: Rscript --vanilla scripts/calibrate_part5_null.R "$RUNNER_TEMP/part5_null_smoke" 1 7 subtype_specific 8 2 100
        if: runner.os != 'Windows'
      - name: Part 5 null calibration smoke
        run: Rscript --vanilla scripts/calibrate_part5_null.R "$env:RUNNER_TEMP\part5_null_smoke" 1 7 subtype_specific 8 2 100
        if: runner.os == 'Windows'
